<!-- MINI SOCRATES MODULE -->
<style>
  #miniSocrates {
    position: fixed;
    left: 0;
    top: 0;
    width: 80px;
    height: 80px;
    z-index: 2000;
    pointer-events: none;
    will-change: transform;
  }
  #miniSocrates svg { width: 100%; height: 100%; overflow: visible; }
  .mini-socrates-body { transform-box: fill-box; transform-origin: 50% 90%; animation: miniSocratesFloat 2.6s ease-in-out infinite; }
  @keyframes miniSocratesFloat { 0%,100% { translate: 0 0; } 50% { translate: 0 -4px; } }
  #miniSocratesBubble {
    position: absolute; bottom: 72%; left: 110%; width: max-content; max-width: 220px;
    background: #fff; border: 2px solid #1a2e63; border-radius: 10px; padding: 8px 11px;
    color: #1e293b; font-size: .78rem; font-weight: 600; line-height: 1.4;
    box-shadow: 0 8px 20px rgba(30,58,138,.16); opacity: 0;
    transform: translateY(6px) scale(.94);
    transition: opacity .18s ease, transform .18s cubic-bezier(.2,1.4,.4,1);
    pointer-events: none;
  }
  #miniSocratesBubble.show { opacity: 1; transform: translateY(0) scale(1); }
  #miniSocratesBubble.left { left: auto; right: 110%; transform-origin: bottom right; }
  #miniSocratesBubble.right { left: 110%; right: auto; transform-origin: bottom left; }
  .mini-socrates-tail {
    position: absolute; bottom: -7px; width: 10px; height: 10px; background: #fff;
    border-right: 2px solid #1a2e63; border-bottom: 2px solid #1a2e63; transform: rotate(45deg);
  }
  #miniSocratesBubble.left .mini-socrates-tail { right: 12px; }
  #miniSocratesBubble.right .mini-socrates-tail { left: 12px; }
  #miniSocrates.hidden { display: none; }
</style>

<div id="miniSocrates">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <defs>
      <linearGradient id="miniSocratesBodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3b82f6"/>
        <stop offset="100%" stop-color="#1e3a8a"/>
      </linearGradient>
    </defs>
    <ellipse cx="60" cy="110" rx="24" ry="5" fill="#1e293b" opacity=".13"/>
    <g class="mini-socrates-body">
      <rect x="24" y="34" width="72" height="70" rx="28" fill="url(#miniSocratesBodyGrad)"/>
      <rect x="24" y="34" width="72" height="70" rx="28" fill="none" stroke="#0f2461" stroke-opacity=".25" stroke-width="1.5"/>
      <g>
        <path d="M42 32 h36 v6 a6 6 0 0 1 -6 6 h-24 a6 6 0 0 1 -6 -6 z" fill="#111827"/>
        <polygon points="60,12 102,26 60,40 18,26" fill="#1e293b"/>
        <circle cx="60" cy="26" r="3" fill="#fbbf24"/>
        <path d="M99 27 v14" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="99" cy="43" r="3.5" fill="#fbbf24"/>
      </g>
      <g>
        <ellipse cx="47" cy="65" rx="10" ry="11" fill="#fff"/>
        <ellipse cx="73" cy="65" rx="10" ry="11" fill="#fff"/>
        <circle cx="47" cy="66" r="4.6" fill="#0f172a"/>
        <circle cx="73" cy="66" r="4.6" fill="#0f172a"/>
      </g>
      <path d="M53 84 q7 6 14 0" fill="none" stroke="#dbeafe" stroke-width="3" stroke-linecap="round"/>
    </g>
  </svg>
  <div id="miniSocratesBubble"><span class="mini-socrates-tail"></span><span id="miniSocratesBubbleText"></span></div>
</div>

<script>
(() => {
  const socrates = document.getElementById('miniSocrates');
  const bubble = document.getElementById('miniSocratesBubble');
  const bubbleText = document.getElementById('miniSocratesBubbleText');
  if (!socrates || !bubble || !bubbleText) return;

  const comments = {
    '지역별 진로정보': [
      '관심 있는 지역의 진로 정보를 살펴볼 수 있어요.',
      '지역을 기준으로 대학과 진로 정보를 탐색해 보세요.',
      '이곳에서 원하는 지역이나 대학을 찾아볼 수 있어요.'
    ],
    '서비스 안내': [
      '처음 방문했다면 이용 방법부터 확인해 보세요.',
      '이 서비스가 어떻게 작동하는지 알아볼까요?',
      '전체적인 이용 흐름을 확인할 수 있어요.'
    ],
    '대학교별 공시정보': [
      '전국 대학교의 공시정보를 확인할 수 있어요.',
      '궁금한 대학의 정보를 직접 찾아보세요.',
      '대학 정보를 비교하고 탐색할 수 있는 공간이에요.'
    ],
    '세특 로드맵 생성': [
      '대화가 끝나면 진로 로드맵을 확인할 수 있어요.',
      '탐색 결과를 바탕으로 나만의 로드맵을 만들어 보세요.',
      '진로 탐색 결과를 학교생활과 연결해 볼 수 있어요.'
    ]
  };

  const defaultComments = [
    '이곳에서 새로운 정보를 확인할 수 있어요.',
    '한번 눌러서 어떤 기능인지 확인해 보세요.',
    '궁금하다면 직접 사용해 보는 것도 좋은 방법이에요.'
  ];

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let targetX = mouseX + 45;
  let targetY = mouseY + 45;
  let currentX = targetX;
  let currentY = targetY;
  let activeElement = null;

  document.addEventListener('mousemove', event => {
    mouseX = event.clientX;
    mouseY = event.clientY;
  });

  function pick(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  function getComment(element) {
    const name = element.dataset.buddy;
    if (name && comments[name]) return pick(comments[name]);

    const text = (element.innerText || element.value || element.getAttribute('aria-label') || '').trim();
    if (text.includes('검색')) return '원하는 정보나 대상을 직접 검색할 수 있어요.';
    if (text.includes('내 위치')) return '현재 위치를 기준으로 주변 정보를 찾아볼 수 있어요.';
    if (text.includes('크게 보기')) return '더 넓은 화면에서 자세히 살펴볼 수 있어요.';
    if (text.includes('다운로드')) return '탐색한 결과를 파일로 저장할 수 있어요.';
    if (text.includes('닫기')) return '현재 창을 닫고 이전 화면으로 돌아갑니다.';
    return pick(defaultComments);
  }

  function getInteractiveElement(target) {
    if (!(target instanceof Element)) return null;
    return target.closest('[data-buddy], button, a, input, select, textarea, [role="button"], [tabindex]:not([tabindex="-1"])');
  }

  document.addEventListener('mouseover', event => {
    const element = getInteractiveElement(event.target);
    if (!element || element === activeElement) return;
    activeElement = element;

    const rect = element.getBoundingClientRect();
    if (mouseX < rect.left + rect.width / 2) {
      targetX = rect.left - 10;
      targetY = rect.top - 25;
      bubble.className = 'right';
    } else {
      targetX = rect.right + 10;
      targetY = rect.top - 25;
      bubble.className = 'left';
    }

    bubbleText.textContent = getComment(element);
    bubble.classList.add('show');
  });

  document.addEventListener('mouseout', event => {
    const element = getInteractiveElement(event.target);
    if (!element || element !== activeElement) return;
    const related = event.relatedTarget;
    if (related instanceof Node && element.contains(related)) return;
    activeElement = null;
    bubble.classList.remove('show');
  });

  function animate() {
    if (!activeElement) {
      targetX = mouseX + 45;
      targetY = mouseY + 45;
    }

    currentX += (targetX - currentX) * 0.12;
    currentY += (targetY - currentY) * 0.12;

    const size = socrates.getBoundingClientRect().width || 80;
    socrates.style.transform = `translate3d(${currentX - size / 2}px, ${currentY - size / 2}px, 0)`;
    requestAnimationFrame(animate);
  }

  animate();

  window.MiniSocrates = {
    show(message) { bubbleText.textContent = message; bubble.classList.add('show'); },
    hide() { bubble.classList.remove('show'); },
    setComment(name, messages) { comments[name] = Array.isArray(messages) ? messages : [messages]; }
  };
})();
</script>
